[package]
name = "threadnote"
version = "0.1.4"
description = "A desktop widget for Gmail, Google Tasks, Calendar, and notes"
authors = ["Threadnote"]
edition = "2021"

[lib]
name = "threadnote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["unstable", "tray-icon"] }
tauri-plugin-sql = { version = "=2.6.0", features = ["sqlite"] }
tauri-plugin-autostart = "=2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
open = "5"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
sha2 = "0.10"
url = "2"
tauri-plugin-single-instance = "2"
